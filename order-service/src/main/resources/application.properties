# Server
server.port=8081

  # Spring Application
spring.application.name=order-service

  # Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb
spring.datasource.username=root
spring.datasource.password=root

  # JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true  

  # Feign client URLs
payment.service.url=http://localhost:8082
inventory.service.url=http://localhost:8083

  # Feign timeouts
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=3000

feign.client.config.payment-service.connectTimeout=2000
feign.client.config.payment-service.readTimeout=3000

feign.client.config.inventory-service.connectTimeout=2000
feign.client.config.inventory-service.readTimeout=3000

feign.circuitbreaker.enabled=true

  # Resilience4j Circuit Breaker - payment-service
resilience4j.circuitbreaker.instances.payment-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-service.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.payment-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.payment-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.payment-service.register-health-indicator=true

  # Resilience4j Circuit Breaker - inventory-service
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventory-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory-service.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.inventory-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.inventory-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventory-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.inventory-service.register-health-indicator=true

  # Retry - payment-service
resilience4j.retry.instances.payment-service.max-attempts=2
resilience4j.retry.instances.payment-service.wait-duration=500ms

  # Retry - inventory-service
resilience4j.retry.instances.inventory-service.max-attempts=2
resilience4j.retry.instances.inventory-service.wait-duration=500ms

  # TimeLimiter - payment-service
resilience4j.timelimiter.instances.payment-service.timeout-duration=3s

  # TimeLimiter - inventory-service
resilience4j.timelimiter.instances.inventory-service.timeout-duration=3s

  # Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers,metrics
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

  # Logging
logging.level.com.example.orderservice=DEBUG
logging.level.io.github.resilience4j=DEBUG